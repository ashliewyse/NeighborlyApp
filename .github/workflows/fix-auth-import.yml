name: Fix Neighborly Auth Import

on:
  push:
    branches:
      - agent/registration-profile
    paths:
      - .github/workflows/fix-auth-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/registration-profile
      - name: Correct AuthView import path
        run: |
          node -e 'const fs=require("fs"); const p="src/app/App.tsx"; let s=fs.readFileSync(p,"utf8"); s=s.replace("@/app/AuthView", "@/app/components/AuthView"); fs.writeFileSync(p,s);'
      - name: Commit corrected import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Supabase AuthView import"
            git push origin HEAD:agent/registration-profile
          fi
