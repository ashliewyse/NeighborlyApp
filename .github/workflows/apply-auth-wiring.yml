name: Apply Neighborly Auth Wiring

on:
  push:
    branches:
      - agent/registration-profile
    paths:
      - .github/workflows/apply-auth-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/registration-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire Supabase auth into Neighborly
        run: node scripts/apply-auth-wiring.mjs
      - name: Commit permanent auth wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx package.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wire Supabase authentication into Neighborly"
            git push origin HEAD:agent/registration-profile
          fi
