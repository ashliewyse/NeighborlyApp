name: Apply Messages Navigation

on:
  push:
    branches:
      - agent/messages-nav
    paths:
      - .github/workflows/apply-messages-nav.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/messages-nav
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply tested Messages change
        run: node scripts/prepare-messages.mjs
      - name: Commit permanent App.tsx update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Messages navigation permanent"
            git push origin HEAD:agent/messages-nav
          fi
